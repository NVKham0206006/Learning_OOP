{% extends "base.html" %}
{% block title %}Đăng ký{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-3">Đăng ký tài khoản</h3>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Tên đăng nhập *</label>
                        <input type="text" name="username" class="form-control" required
                               value="{{ form.username or '' }}" minlength="3">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Họ tên *</label>
                        <input type="text" name="full_name" class="form-control" required
                               value="{{ form.full_name or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" name="email" class="form-control" required
                               value="{{ form.email or '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Số điện thoại</label>
                        <input type="text" name="phone" class="form-control"
                               value="{{ form.phone or '' }}">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Mật khẩu *</label>
                            <input type="password" name="password" class="form-control" required minlength="6">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Xác nhận *</label>
                            <input type="password" name="confirm_password" class="form-control" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
                </form>
                <hr>
                <p class="text-center mb-0">
                    Đã có tài khoản? <a href="{{ url_for('auth.login') }}">Đăng nhập</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
